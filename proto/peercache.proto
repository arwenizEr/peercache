// Package peercache.v1 describes the peer-to-peer wire format.
//
// This file is normative documentation, not the source of generated Go. There
// is no protoc step in this build and no .pb.go in the tree. See
// docs/decisions/0014-grpc-without-protobuf.md for the argument; the short
// version is that docs/design.md fixes every pod to the same binary, which removes
// the cross-language and mixed-schema benefits protobuf exists to provide,
// while internal/codec already supplies a fuzzed, framed, registered codec for
// exactly these bodies.
//
// What is real: the service below is served by gRPC, over the method names
// spelled here, with request and response bodies encoded by internal/codec.
// This file exists so the wire format can be read and reviewed in one place
// rather than reconstructed from Go structs. It is kept in step with
// internal/transport/method.go; the pairing is asserted by
// TestProtoMatchesMethodConstants.
syntax = "proto3";

package peercache.v1;

option go_package = "github.com/arwenizEr/peercache/proto;peercachev1";

// Peer is the single service every pod both serves and dials.
//
// Every method is unary. Streaming is deliberately absent: a resumable
// partition transfer is the first thing that will want it, and adding a
// streaming method later does not reshape the unary ones. See
// docs/decisions/open.md question 1.
service Peer {
  // Get reads one key from the namespace's owned store on this node.
  rpc Get(GetRequest) returns (GetResponse);

  // ReplicaGet asks a node holding a replica of a key for its copy, in a
  // namespace opened with replica reads. The replica answers only with a copy
  // it received within the namespace's L1 TTL and only while it still ranks as
  // a replica; otherwise it declines and the caller asks the owner. It never
  // answers "absent", because only the owner knows that.
  rpc ReplicaGet(ReplicaGetRequest) returns (ReplicaGetResponse);

  // Load reads one key, reconstructing it from the namespace's registered
  // loader if it is absent.
  //
  // It is separate from Get because the loader must run on the owner and
  // nowhere else. If every node loaded its own copy, a cold key would send one
  // request per pod to whatever the loader talks to — the stampede that
  // single-flighting exists to prevent, reintroduced at cluster scale.
  rpc Load(LoadRequest) returns (LoadResponse);

  // Set writes one key. The owner assigns the version.
  rpc Set(SetRequest) returns (SetResponse);

  // Delete removes one key. Removing an absent key is not an error.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // CondSet writes one key only if a condition holds on the owner: the key is
  // absent (SetIfAbsent), or it holds exactly the given old value
  // (CompareAndSwap). The check and the write are one step under the owner's
  // store lock. Not idempotent: a caller that loses the reply must not retry.
  rpc CondSet(CondSetRequest) returns (CondSetResponse);

  // Increment adds a delta to the base-10 integer stored under one key and
  // returns the result. Not idempotent, for the same reason as CondSet.
  rpc Increment(IncrementRequest) returns (IncrementResponse);

  // Touch gives one key a new lifetime without changing its value.
  rpc Touch(TouchRequest) returns (TouchResponse);

  // BatchGet reads many keys from one namespace in one round trip. The
  // caller has already grouped keys by owner, so every key here belongs to
  // the node being asked.
  rpc BatchGet(BatchGetRequest) returns (BatchGetResponse);

  // Call runs a registered group function on the group's owner, inside a
  // single actor turn. This is the primary API: computation moves to the
  // data rather than the data moving to the caller.
  rpc Call(CallRequest) returns (CallResponse);

  // Submit applies many messages to many groups on this owner in one round
  // trip. Each group's messages are applied inside a single actor turn, which
  // is the batch-affinity requirement of docs/design.md §3.4: ten thousand messages
  // spread over three owners cost three requests, not ten thousand.
  rpc Submit(SubmitRequest) returns (SubmitResponse);

  // Replicate sends a copy of an owned key to a node that ranks as one of its
  // replicas. Asynchronous by default and synchronous per namespace; the
  // difference is whether the owner waits for the response, not what is sent.
  rpc Replicate(ReplicateRequest) returns (ReplicateResponse);

  // CatchUp asks an owner for every key it holds that the caller should be
  // replicating. A node that has restarted comes back with empty memory and no
  // way to learn what it is responsible for except by asking.
  rpc CatchUp(CatchUpRequest) returns (CatchUpResponse);

  // Invalidate tells a peer that a key it may be caching is stale. It is a
  // latency optimisation and nothing more — correctness never depends on
  // one of these arriving. See design principle 6 (docs/design.md).
  rpc Invalidate(InvalidateRequest) returns (InvalidateResponse);
}

// Stamp is an owner-issued (epoch, version) pair.
//
// Version alone is NOT a cluster-wide monotonic counter: a key's version
// restarts at 1 when its store entry is reclaimed, so a version can decrease
// over a key's lifetime. See docs/decisions/open.md question 18. Comparison is
// therefore lexicographic on (epoch, version), and even that is only an
// optimisation — the L1 TTL is the real staleness bound.
message Stamp {
  uint64 epoch = 1;
  uint64 version = 2;
}

message GetRequest {
  string namespace = 1;
  string key = 2;
  // epoch is the membership epoch the caller resolved ownership under. The
  // owner refuses the call if it is stale. See ownership.Guard.CanActivateAt.
  uint64 epoch = 3;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  Stamp stamp = 3;
  // ttl_remaining_ns bounds how long the caller may cache this value in its
  // non-owned tier. Zero means the owner set no TTL, in which case the
  // caller applies its own L1 maximum. The caller always clamps.
  int64 ttl_remaining_ns = 4;
}

message ReplicaGetRequest {
  string namespace = 1;
  string key = 2;
  uint64 epoch = 3;
}

message ReplicaGetResponse {
  // served is false when the replica declines; the caller then asks the
  // owner. Nothing else in the message is meaningful in that case.
  bool served = 1;
  bytes value = 2;
  Stamp stamp = 3;
  // age_ns is how long ago, by the replica's clock, it received this copy.
  // The caller caches the value for its L1 TTL minus this.
  int64 age_ns = 4;
}

message LoadRequest {
  string namespace = 1;
  string key = 2;
  uint64 epoch = 3;
}

message LoadResponse {
  bool found = 1;
  bytes value = 2;
  Stamp stamp = 3;
  int64 ttl_remaining_ns = 4;
}

message SetRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  int64 ttl_ns = 4;
  uint64 epoch = 5;
}

message SetResponse {
  Stamp stamp = 1;
}

message DeleteRequest {
  string namespace = 1;
  string key = 2;
  uint64 epoch = 3;
}

message DeleteResponse {}

message CondSetRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  // compare selects CompareAndSwap: write only if the key holds exactly old.
  // Otherwise SetIfAbsent: write only if the key is absent.
  bool compare = 4;
  bytes old = 5;
  int64 ttl_ns = 6;
  uint64 epoch = 7;
}

message CondSetResponse {
  bool stored = 1;
  // Set when the write happened but replication fell short (ErrUnderReplicated).
  string under_replicated = 2;
}

message IncrementRequest {
  string namespace = 1;
  string key = 2;
  int64 delta = 3;
  // ttl_ns applies only when the increment creates the key.
  int64 ttl_ns = 4;
  uint64 epoch = 5;
}

message IncrementResponse {
  int64 value = 1;
  // Set when the write happened but replication fell short (ErrUnderReplicated).
  string under_replicated = 2;
}

message TouchRequest {
  string namespace = 1;
  string key = 2;
  int64 ttl_ns = 3;
  uint64 epoch = 4;
}

message TouchResponse {
  bool existed = 1;
  // Set when the write happened but replication fell short (ErrUnderReplicated).
  string under_replicated = 2;
}

message BatchGetRequest {
  string namespace = 1;
  repeated string keys = 2;
  uint64 epoch = 3;
}

message BatchGetResponse {
  // entries is sparse: a key that was absent on the owner has no entry.
  // Callers must not assume index alignment with the request.
  repeated BatchEntry entries = 1;
}

message BatchEntry {
  string key = 1;
  bytes value = 2;
  Stamp stamp = 3;
  int64 ttl_remaining_ns = 4;
}

message CallRequest {
  string group = 1;
  // func_name selects a function registered at startup. Closures never
  // cross the network; see design principle 3 (docs/design.md).
  string func_name = 2;
  bytes args = 3;
  uint64 epoch = 4;
}

message CallResponse {
  bytes result = 1;
}

message SubmitRequest {
  // func_name is the registered function applied to every batch here. One
  // router carries one handler, so it is named once rather than per group.
  string func_name = 1;
  repeated GroupBatch batches = 2;
  uint64 epoch = 3;
}

message GroupBatch {
  string group = 1;
  // messages are the encoded payloads, in submission order. The owner passes
  // the whole list to the handler as one argument so that it runs as one turn.
  repeated bytes messages = 2;
}

message SubmitResponse {
  // failures is sparse: a group that applied cleanly has no entry. Partial
  // failure is real here — there is no cross-group atomicity, ever
  // (docs/design.md), so the response says which groups did not take.
  repeated GroupFailure failures = 1;
}

message GroupFailure {
  string group = 1;
  string error = 2;
}

message ReplicateRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  int64 ttl_ns = 4;
  // stamp is the owner's (epoch, version). The replica keeps it so that, if it
  // is promoted, it continues the version sequence rather than restarting it.
  Stamp stamp = 5;
  // from is the sending node's ID. Two different senders writing one key under
  // one epoch is a split brain, and the replica is the only party that can see
  // both. See docs/design.md section 4.
  string from = 6;
  // deleted marks a removal rather than a write. A deletion has to replicate:
  // a replica that missed it would resurrect the key on promotion.
  bool deleted = 7;
  // order is the write's persistence order, zero in a namespace without
  // persistence. A promoted replica continues it.
  uint64 order = 8;
}

message ReplicateResponse {
  // conflict reports that this copy collided with one from a different node in
  // the same epoch. It is counted, never merged.
  bool conflict = 1;
}

message CatchUpRequest {
  string namespace = 1;
  // requester is the node asking. The owner replies with the keys for which
  // that node ranks as a replica, which it can compute itself — the asker does
  // not have to enumerate what it wants.
  string requester = 2;
  // replication_factor is the asker's configured factor for this namespace.
  // Sent because namespace options are per-node configuration and the owner
  // must not assume its own match.
  int32 replication_factor = 3;
  // after bounds the response. The owner returns keys sorted and the caller
  // pages by passing the last key it received, so one catch-up cannot produce
  // an unbounded message.
  string after = 4;
  int32 limit = 5;
}

message CatchUpResponse {
  repeated CatchUpEntry entries = 1;
  // more reports that the owner had further keys beyond the limit.
  bool more = 2;
}

message CatchUpEntry {
  string key = 1;
  bytes value = 2;
  Stamp stamp = 3;
  int64 ttl_ns = 4;
  uint64 order = 5;
}

message InvalidateRequest {
  string namespace = 1;
  repeated string keys = 2;
  // stamp is the owner's stamp *after* the change. A receiver drops a
  // cached copy only if what it holds is older.
  Stamp stamp = 3;
}

message InvalidateResponse {}
