name: CI

on:
  push:
    branches: [main]
  pull_request:

# A stale run tells you nothing useful once a newer commit exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"

jobs:
  build:
    name: vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt is clean
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: staticcheck ./...

      - name: test
        run: go test ./... -timeout 300s

      # Each example asserts the behaviour it demonstrates and exits non-zero
      # if it is wrong. Compiling them is not enough: a change once made the
      # lifecycle example's assertions false and nothing noticed, because
      # nothing ran them.
      - name: latency gate
        # Alone, and without the race detector. A sub-microsecond budget
        # measured while other packages' gRPC servers and gossip clusters
        # compete for the same cores reports the runner's load, not the cache's
        # latency. See the skip in TestLocalGetP99AtOneMillionKeys. "shared"
        # holds the remote budgets as a regression ceiling: a hosted runner
        # is not the reference machine the criterion was measured on.
        env:
          PEERCACHE_LATENCY_GATE: shared
        run: go test . -run 'TestLocalGetP99AtOneMillionKeys|TestRemoteGetThroughputAndLatency' -count=1 -p 1

      # A separate invocation, not another name in the -run above. This test
      # stands up its own gRPC cluster, and sharing a process with the latency
      # budgets pushed the remote p99 over its limit -- the same contention the
      # step above exists to avoid. It measures the async replication window
      # docs/design.md section 6 asks for a number for, and for a long time it
      # ran in no configuration at all: it was gated behind PEERCACHE_LATENCY_GATE and
      # then never named by any step that sets it.
      - name: async replication loss window
        env:
          PEERCACHE_LATENCY_GATE: shared
        run: go test . -run 'TestAsyncLossWindowOverGRPC' -count=1 -p 1

      - name: examples run
        run: |
          go run ./examples/lifecycle
          go run ./examples/namespace
          go run ./examples/groups
          go run ./examples/ownership
          go run ./examples/remote
          go run ./examples/replication
          go run ./examples/rolling-upgrade
          go run ./examples/observability
          go run ./examples/failure-guarantees

      # internal/l1/eval is a nested module, so `go test ./...` never sees it.
      # Compiling it keeps the cache-library comparison from rotting into
      # something nobody can re-run; the benchmarks themselves stay manual.
      - name: l1 evaluation harness compiles
        run: cd internal/l1/eval && go vet ./...

  race:
    name: test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # -count=2 is not padding. It catches state that survives between runs of
      # the same test, which is the failure mode a harness with shared fakes is
      # most likely to introduce.
      #
      # The timeout is 900s, not the 300s the other steps use, and the two are
      # different for a reason worth stating. `-timeout` applies per test binary,
      # so this step has to fit *two* race passes of the root package inside it.
      # One pass measures ~215s on Machine A; 300s could not hold two, which
      # running this exact command confirmed, and getting `panic: test timed
      # out after 5m0s` with a test running normally at the alarm. The corrected
      # gate measures 527s end-to-end, so the margin here is 1.7x — it was 2.0x
      # before the simulation tests landed. Re-measure it rather than inherit it.
      #
      # A timeout here is a deadlock detector, not a performance budget. 900s
      # still turns a hang into a failure rather than a job that runs until the
      # runner's own limit; what 300s had quietly become was a budget the suite
      # outgrew without anybody deciding it should.
      - name: test -race
        run: go test ./... -race -count=2 -timeout 900s

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Benchmarks run in CI for regression, not just for the record. A shared
      # runner is too noisy to gate on absolute numbers, so this gate is
      # "benchmarks still compile and complete", and the tracked numbers in
      # docs/benchmarks.md come from a known machine.
      - name: bench
        run: go test ./... -run '^$' -bench . -benchmem -benchtime 100ms -count 1

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Short by design: this is a regression gate, not a fuzzing campaign. The
      # seed corpus runs on every `go test`; this adds a bounded search on top,
      # and any crasher it finds is committed to testdata/ and becomes a
      # permanent case. The long campaign is nightly.yml.
      #
      # Every pattern is anchored, and that is not style. `-fuzz` takes a
      # regexp, and an unanchored one is a prefix waiting for a sibling: adding
      # FuzzDecodeEveryMessage next to FuzzDecode made `-fuzz FuzzDecode` match
      # two targets, which Go refuses with "will not fuzz, -fuzz matches more
      # than one fuzz test" — this step was broken by a test being *added*
      # elsewhere. TestFuzzTargetsNamedInCIExist now fails on an ambiguous
      # pattern, and on one that matches nothing.
      - name: fuzz the frame parser
        run: |
          go test ./internal/codec -run '^$' -fuzz '^FuzzUnframe$' -fuzztime 60s
          go test ./internal/codec -run '^$' -fuzz '^FuzzFrameRoundTrip$' -fuzztime 60s

      # The codecs carry application values. This is the only check that what
      # goes into one comes back out unchanged; TestCodecRoundTrip compares
      # lengths.
      - name: fuzz the codecs
        run: |
          go test ./internal/codec -run '^$' -fuzz '^FuzzCodecRoundTrip$' -fuzztime 60s

      - name: fuzz the message decoder
        run: |
          go test ./internal/wire -run '^$' -fuzz '^FuzzDecode$' -fuzztime 60s
          go test ./internal/wire -run '^$' -fuzz '^FuzzDecodeEveryMessage$' -fuzztime 60s

      # The group key decides ownership, so a partitioner that disagrees with
      # itself is a key with two owners.
      - name: fuzz the partitioner
        run: |
          go test . -run '^$' -fuzz '^FuzzPartitionByPrefix$' -fuzztime 60s

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: cover
        run: |
          go test ./... -covermode atomic -coverprofile coverage.out -timeout 300s
          go tool cover -func coverage.out | tail -n 1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
